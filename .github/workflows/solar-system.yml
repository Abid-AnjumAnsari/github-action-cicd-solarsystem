name: Solar System Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
  MONGO_URI: 'mongodb+srv://${{ vars.MONGO_USERNAME }}:${{ secrets.MONGO_PASSWORD }}@cluster0.dqmuih9.mongodb.net/test?retryWrites=true&w=majority'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
  unit-testing:
    name: Unit Testing
    strategy:
      matrix:
        nodejs_version: [18, 20]
        operating_system: [ubuntu-latest]
        exclude:
          - nodejs_version: 18
            operating_system: macos-latest
    runs-on: ${{ matrix.operating_system }}
    services:
      mongo-db:
        image: siddharth67/mongo-db:non-prod
        ports:
          - 27017:27017
    env:
      MONGO_URI: 'mongodb://localhost:27017/superData'
      MONGO_USERNAME: non-prod-user
      MONGO_PASSWORD: non-prod-password
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NodeJS Version ${{ matrix.nodejs_version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.nodejs_version }}

      - name: Cache NPM dependencies
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies
        run: npm install

      - name: Unit Testing
        id: nodejs-unit-testing
        run: npm test

      - name: Archive Test Result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Mocha-Test-Result
          path: test-results.xml

  codecoverage:
    runs-on: ubuntu-latest
    container:
      image: node:18
    services:
      mongo:
        image: siddharth67/mongo-db:non-prod
        options: --name mongo
    env:
      MONGO_URI: 'mongodb://mongo:27017/superData'
      MONGO_USERNAME: non-prod-user
      MONGO_PASSWORD: non-prod-password
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache NPM dependencies
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install Dependency
        run: npm install

      - name: Code Coverage
        continue-on-error: true
        run: npm run coverage

      - name: Archive coverage Result
        uses: actions/upload-artifact@v7
        with:
          name: Code-Coverage-Result
          path: coverage
          retention-days: 5

  reports-s3:
    name: AWS S3 – Upload Reports
    needs: [unit-testing, codecoverage]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Download Mocha Test Artifact
        uses: actions/download-artifact@v4
        with:
          name: Mocha-Test-Result

      - name: Download Code Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: Code-Coverage-Result

      - name: Merge Test Files
        run: |
          echo "Listing workspace contents..."
          ls -ltr
          echo "Creating reports directory..."
          mkdir reports-${{ github.sha }}
          mv cobertura-coverage.xml reports-${{ github.sha }}/
          mv test-results.xml       reports-${{ github.sha }}/
          echo "Final contents:"
          ls -ltr reports-${{ github.sha }}/

      - name: Upload to AWS S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --follow-symlinks --delete
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          SOURCE_DIR: reports-${{ github.sha }}
          DEST_DIR: reports-${{ github.sha }}

  docker:
    name: Containerization
    needs: [unit-testing, codecoverage]
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

      - name: Docker Image Testing
        run: |
          docker images
          docker run --name solar-system-app -d \
            -p 3000:3000 \
            -e MONGO_URI=$MONGO_URI \
            -e MONGO_USERNAME=$MONGO_USERNAME \
            -e MONGO_PASSWORD=$MONGO_PASSWORD \
            ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

          export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
          echo $IP

          echo Testing Image URL using wget
          wget -q -O - 127.0.0.1:3000/live | grep live

      - name: pushing docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}

  dev-deploy:
    if: contains(github.ref, 'feature/')
    needs: [docker]
    uses: ./.github/workflows/reuse-deployment.yml
    with:
      kubectl-version: v1.27.0
      environment: development
      k8s-manifest-dir: kubernetes/development
    secrets:
      KUBECONFIG: ${{ secrets.KUBECONFIG }}
      MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

  run-seeder:
    name: Run DB Seeder Job
    needs: dev-deploy
    runs-on: ubuntu-latest
    if: ${{ success() }}
    env:
      IMAGE_TAG: ${{ github.sha }}
      NAMESPACE: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write kubeconfig from secret (runner-readable)
        shell: bash
        run: |
          if [ -z "${{ secrets.KUBECONFIG }}" ]; then
            echo "ERROR: KUBECONFIG secret is empty" >&2
            exit 1
          fi
          echo "${{ secrets.KUBECONFIG }}" > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          kubectl --kubeconfig "$KUBECONFIG" version --short || true

      - name: Debug list repo and kubernetes files
        run: |
          echo "PWD: $(pwd)"
          echo "Repo root:"
          ls -la
          echo "kubernetes dir:"
          ls -la kubernetes || true
          echo "kubernetes/development dir:"
          ls -la kubernetes/development || true

      - name: Show seed manifest if present
        run: |
          if [ -f kubernetes/development/seed-job.yaml ]; then
            echo "---- seed-job.yaml head ----"
            sed -n '1,200p' kubernetes/development/seed-job.yaml
            echo "---- end ----"
          else
            echo "ERROR: seed-job.yaml not found in kubernetes/development"
            exit 1
          fi

      - name: Install kubectl CLI
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.26.0'

      - name: Prepare seed manifest (envsubst)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gettext-base || true
          export IMAGE_TAG="${IMAGE_TAG}"
          envsubst '${IMAGE_TAG}' < kubernetes/development/seed-job.yaml > /tmp/seed-job.yaml
          echo "Prepared /tmp/seed-job.yaml:"
          sed -n '1,200p' /tmp/seed-job.yaml || true

      - name: Delete existing seed Job (if any)
        shell: bash
        run: |
          export KUBECONFIG=/tmp/kubeconfig
          kubectl --kubeconfig "$KUBECONFIG" -n "$NAMESPACE" delete job solar-system-seed --ignore-not-found=true || true
          for i in $(seq 1 6); do
            kubectl --kubeconfig "$KUBECONFIG" -n "$NAMESPACE" get job solar-system-seed >/dev/null 2>&1 || break
            sleep 1
          done

      - name: Apply seed Job
        run: |
          export KUBECONFIG=/tmp/kubeconfig
          kubectl --kubeconfig "$KUBECONFIG" -n "$NAMESPACE" apply -f /tmp/seed-job.yaml

      - name: Wait for seed Job completion
        run: |
          export KUBECONFIG=/tmp/kubeconfig
          kubectl --kubeconfig "$KUBECONFIG" -n "$NAMESPACE" wait --for=condition=complete job/solar-system-seed --timeout=300s || true

      - name: Stream seed Job logs
        run: |
          export KUBECONFIG=/tmp/kubeconfig
          kubectl --kubeconfig "$KUBECONFIG" -n "$NAMESPACE" logs -l job-name=solar-system-seed --tail=500 || true

      - name: Cleanup seed Job
        run: |
          export KUBECONFIG=/tmp/kubeconfig
          kubectl --kubeconfig "$KUBECONFIG" -n "$NAMESPACE" delete job solar-system-seed || true

  dev-integration-testing:
    name: Dev Integration Testing
    if: contains(github.ref, 'feature/')
    needs: [run-seeder, dev-deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Test `/live` Endpoint
        env:
          URL: ${{ needs.dev-deploy.outputs.application-url }}
        run: |
          echo "Testing endpoint: https://$URL/live"
          curl https://$URL/live -s -k | jq -r .status | grep -iq live

  prod-deploy:
    if: github.ref == 'refs/heads/main'
    needs: [docker]
    uses: ./.github/workflows/reuse-deployment.yml
    with:
      kubectl-version: v1.27.0
      environment: production
      k8s-manifest-dir: kubernetes/production
    secrets:
      KUBECONFIG: ${{ secrets.KUBECONFIG }}
      MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

  prod-integration-testing:
    name: Prod Integration Testing
    if: github.ref == 'refs/heads/main'
    needs: prod-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Test `/live` Endpoint
        env:
          URL: ${{ needs.prod-deploy.outputs.application-url}}
        run: |
          sleep 30
          echo "Testing endpoint: https://$URL/live"
          curl https://$URL/live -s -k | jq -r .status | grep -iq live
  
  slack-notification:
    if: always()
    name: Slack Notification
    needs: [dev-integration-testing, prod-integration-testing]
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send Slack notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: '#all-github-action-pipeline'
          SLACK_COLOR: ${{ job.status }}
          SLACK_ICON: https://gitlab.com/sidd-harth/solar-system/-/raw/main/images/saturn.png
          SLACK_MESSAGE: ":hammer_and_wrench: Triggered by ${{ github.actor }}"
          SLACK_TITLE: "Pipeline Status"