name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
env:
  MONGO_URI: 'mongodb+srv://${{vars.MONGO_USERNAME}}:${{secrets.MONGO_PASSWORD}}@cluster0.dqmuih9.mongodb.net/test?retryWrites=true&w=majority'

jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: |
           actions/checkout@v4
           run echo '${{MONGO_USERNAME}}'
           run echc  '${{MONGO_PASSWORD}}'

        - name: Setup NodeJS  Version
          uses: actions/setup-node@v3
          with:
            node-version: 20
    
        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result
          uses: actions/upload-artifact@v7
          with:
            name: Mocha-Test-Result
            path: test-results.xml